name: reusable-python-ci

# Общий гейт для Python-проектов организации.
# Вызывается из репозитория-потребителя:
#   jobs:
#     python:
#       uses: nto-corpsec/.github/.github/workflows/reusable-python-ci.yml@main

on:
  workflow_call:
    inputs:
      python-version:
        description: Версия Python, которую поставит uv
        required: false
        type: string
        default: "3.13"
      working-directory:
        description: Каталог Python-проекта относительно корня репозитория
        required: false
        type: string
        default: "."
      coverage-threshold:
        description: Минимальное покрытие в процентах
        required: false
        type: number
        default: 60

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen --all-extras
      - name: Format check
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check --output-format=github .

  types:
    name: types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen --all-extras
      - name: Type check
        run: uv run mypy src

  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ inputs.python-version }}
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen --all-extras
      - name: Run tests
        run: >-
          uv run pytest
          --cov=src
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=${{ inputs.coverage-threshold }}
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage
          path: ${{ inputs.working-directory }}/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

name: reusable-security

# Безопасность без платных GitHub Advanced Security:
# gitleaks (история коммитов), semgrep (SAST), bandit (Python), pip-audit (SCA).

on:
  workflow_call:
    inputs:
      working-directory:
        description: Каталог проекта
        required: false
        type: string
        default: "."
      semgrep-config:
        description: Ruleset semgrep (p/python, p/secrets, p/owasp-top-ten)
        required: false
        type: string
        default: "p/secrets"
      bandit-paths:
        description: Пути для bandit; пусто — шаг пропускается
        required: false
        type: string
        default: ""
      run-gitleaks:
        description: Сканировать историю gitleaks
        required: false
        type: boolean
        default: true
      run-pip-audit:
        description: Проверять зависимости через pip-audit
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      SEMGREP_CONFIG: ${{ inputs.semgrep-config }}
      BANDIT_PATHS: ${{ inputs.bandit-paths }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        if: inputs.run-gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          if ! output=$(/tmp/gitleaks detect --source . --redact --no-banner --exit-code 1 2>&1); then
            printf '%s\n' "$output"
            exit 1
          fi
          printf '%s\n' "$output"
          if printf '%s' "$output" | grep -q "ERR"; then
            echo "::error::gitleaks не смог просканировать репозиторий"
            exit 1
          fi
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Semgrep
        run: >
          uvx --from "semgrep==1.182.1" semgrep scan
          --config "$SEMGREP_CONFIG"
          --error --quiet --metrics=off --disable-version-check
          --exclude .venv --exclude vendor --exclude node_modules .
      - name: Bandit
        if: inputs.bandit-paths != ''
        run: uvx --from "bandit==1.9.4" bandit -q -r "$BANDIT_PATHS" -x tests
      - name: Dependency audit
        if: inputs.run-pip-audit
        run: |
          uv lock --check
          uvx --from "pip-audit==2.10.1" pip-audit --progress-spinner off

name: reusable-docs

on:
  workflow_call:
    inputs:
      check-external-links:
        description: Проверять внешние ссылки (медленно и нестабильно)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@992badcdf24e3b8eb7e87ff9287fe931bcb00c6e # v20.0.0
        with:
          globs: "**/*.md"
      - name: Local links
        if: ${{ !inputs.check-external-links }}
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/lychee.tar.gz \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.18.1/lychee-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/lychee.tar.gz -C /tmp lychee
          mapfile -t files < <(git ls-files '*.md')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "markdown-файлов нет — проверять нечего"
            exit 0
          fi
          /tmp/lychee --offline --no-progress "${files[@]}"

      - name: All links
        if: ${{ inputs.check-external-links }}
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/lychee.tar.gz \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.18.1/lychee-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/lychee.tar.gz -C /tmp lychee
          mapfile -t files < <(git ls-files '*.md')
          /tmp/lychee --no-progress --max-retries 2 --accept 200,206,429 "${files[@]}"

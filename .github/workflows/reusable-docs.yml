name: reusable-docs

on:
  workflow_call:
    inputs:
      check-external-links:
        description: Проверять внешние ссылки (медленно и нестабильно)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@992badcdf24e3b8eb7e87ff9287fe931bcb00c6e # v20.0.0
        with:
          globs: "**/*.md"
      - name: Local links
        if: ${{ !inputs.check-external-links }}
        uses: lycheeverse/lychee-action@82202e5e9c2f4ef1a55a3d02563e1cb6041e5332 # v2.4.1
        with:
          args: --offline --no-progress --accept 200,206,429 "./**/*.md"
          fail: true
      - name: All links
        if: ${{ inputs.check-external-links }}
        uses: lycheeverse/lychee-action@82202e5e9c2f4ef1a55a3d02563e1cb6041e5332 # v2.4.1
        with:
          args: --no-progress --max-retries 2 --accept 200,206,429 "./**/*.md"
          fail: true
